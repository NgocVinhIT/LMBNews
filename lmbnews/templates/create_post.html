{% extends 'base.html' %}

{% block title %}Viết Bài Mới - LMBNews{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm p-4 bg-white rounded">
            <h2 class="fw-bold text-dark mb-4 text-center">✍️ Đăng bài viết mới lên LMBNews</h2>
            
            <form action="{{ url_for('create_post') }}" method="POST">
                <!-- 1. Ô nhập Tiêu đề bài viết -->
                <div class="mb-3">
                    <label for="title" class="form-label fw-semibold text-secondary">Tiêu đề bài viết</label>
                    <input type="text" class="form-control form-control-lg" id="title" name="title" placeholder="Nhập tiêu đề hấp dẫn tại đây..." required>
                </div>

                <div class="row">
                    <!-- 2. Ô chọn Danh mục (Learn / Movie / Book) -->
                    <div class="col-md-6 mb-3">
                        <label for="category" class="form-label fw-semibold text-secondary">Chuyên mục</label>
                        <select class="form-select" id="category" name="category" onchange="toggleRatingField()" required>
                            <option value="" disabled selected>-- Chọn chuyên mục --</option>
                            <option value="learn">📚 Learn (Kiến thức học tập)</option>
                            <option value="movie">🍿 Movie (Review Phim ảnh)</option>
                            <option value="book">📖 Book (Review Sách truyện)</option>
                        </select>
                    </div>

                    <!-- 3. Ô chọn Đánh giá sao (Mặc định ẩn, chỉ hiện khi chọn Movie hoặc Book) -->
                    <div class="col-md-6 mb-3" id="rating-group" style="display: none;">
                        <label for="rating" class="form-label fw-semibold text-secondary">Đánh giá của bạn</label>
                        <select class="form-select text-warning fw-bold" id="rating" name="rating">
                            <option value="" selected>Không đánh giá sao</option>
                            <option value="5">⭐⭐⭐⭐⭐ (Xuất sắc)</option>
                            <option value="4">⭐⭐⭐⭐ (Rất tốt)</option>
                            <option value="3">⭐⭐⭐ (Bình thường)</option>
                            <option value="2">⭐⭐ (Kém)</option>
                            <option value="1">⭐ (Tệ)</option>
                        </select>
                    </div>
                </div>

                <!-- 4. Ô nhập Nội dung bài viết -->
                <div class="mb-4">
                    <label for="content" class="form-label fw-semibold text-secondary">Nội dung chi tiết</label>
                    <textarea class="form-control" id="content" name="content" rows="8" placeholder="Viết chia sẻ hoặc bài review chi tiết của bạn vào đây..." required></textarea>
                </div>

                <!-- Nút bấm điều hướng -->
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary px-4">Quay lại</a>
                    <button type="submit" class="btn btn-warning fw-bold px-5 text-dark shadow-sm">Đăng bài ngay 🚀</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Đoạn JavaScript nhỏ để tự động hiện ô Đánh giá sao khi chọn Movie/Book -->
<script>
function toggleRatingField() {
    var categorySelect = document.getElementById("category");
    var ratingGroup = document.getElementById("rating-group");
    
    if (categorySelect.value === "movie" || categorySelect.value === "book") {
        ratingGroup.style.display = "block";
    } else {
        ratingGroup.style.display = "none";
        document.getElementById("rating").value = ""; // Reset về rỗng nếu chọn Learn
    }
}
</script>
{% endblock %}
